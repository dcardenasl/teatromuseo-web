name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  security:
    name: Dependency and image security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit PHP dependencies
        run: composer audit --abandoned=ignore

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Build production image
        run: docker build --tag ci4-website-builder-web:security .

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ci4-website-builder-web:security
          format: cyclonedx-json
          output-file: ci4-website-builder-web.cdx.json
          artifact-name: ci4-website-builder-web-sbom

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci4-website-builder-web:security
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
