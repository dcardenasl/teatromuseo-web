name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, json, curl
          coverage: ${{ matrix.php-version == '8.2' && 'xdebug' || 'none' }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check Composer platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar writable/htmlpurifier
          chmod -R 777 writable

      - name: Create .env file
        run: |
          cp .env.example .env
          echo 'CI_ENVIRONMENT = testing' >> .env
          echo 'app.baseURL = "http://localhost/"' >> .env
          echo 'WEB_API_BASE_URL = http://localhost:8190' >> .env
          echo 'WEB_API_KEY = ci_testing_key' >> .env

      - name: Quality gate
        run: composer quality

      - name: Coverage gate (>= 60% line coverage)
        if: matrix.php-version == '8.2'
        run: |
          composer test:coverage
          composer coverage:check

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Build frontend assets
        run: npm run build:all

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

  public-route-contract:
    name: Web/BFF public route contract parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Web
        uses: actions/checkout@v4

      - name: Checkout BFF contract adapter
        uses: actions/checkout@v4
        with:
          repository: dcardenasl/teatromuseo-bff
          ref: dev
          path: bff-contract

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check the canonical Web contract
        run: php scripts/check-public-route-contract.php

      - name: Compare the BFF adapter with the Web contract
        run: |
          php scripts/export-public-route-contract.php > /tmp/web-public-routes.json
          php bff-contract/scripts/export-public-route-contract.php > /tmp/bff-public-routes.json
          diff --unified=0 /tmp/web-public-routes.json /tmp/bff-public-routes.json
